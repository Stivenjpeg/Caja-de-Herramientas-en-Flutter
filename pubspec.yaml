
name: caja_herramientas
description: Aplicacion educativa de herramientas y consultas de APIs para ITLA.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/foto-perfil.jpg

flutter_launcher_icons:
  android: true
  image_path: "assets/foto-perfil.jpg"
  min_sdk_android: 21
